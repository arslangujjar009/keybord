<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- LEFT SIDE -->
      <div class="left-side">
        <h1 class="left-title">Your Result</h1>

        <div class="score">
          <span class="score-number">30</span>
          <span class="score-total">of 100</span>
        </div>

        <h2 class="result-text">Great</h2>
        <p class="description">
          You scored higher than 35% of people who took this test.
        </p>
      </div>

      <!-- RIGHT SIDE -->
      <div class="right-side">
        <h2 class="summary-title">Summary</h2>

        <ul class="score-list">

          <li class="item reaction">
            <div class="item-left">
              <img src="./zap.svg" alt="Reaction icon">
              <span class="item-title">Reaction</span>
            </div>
            <div class="item-score">
              <strong>80</strong> / 100
            </div>
          </li>

          <li class="item memory">
            <div class="item-left">
              <img src="./brain.svg" alt="Memory icon">
              <span class="item-title">Memory</span>
            </div>
            <div class="item-score">
              <strong>82</strong> / 100
            </div>
          </li>

          <li class="item verbal">
            <div class="item-left">
              <img src="./message-circle-more.svg" alt="Verbal icon">
              <span class="item-title">Verbal</span>
            </div>
            <div class="item-score">
              <strong>81</strong> / 100
            </div>
          </li>

          <li class="item visual">
            <div class="item-left">
              <img src="./eye.svg" alt="Visual icon">
              <span class="item-title">Visual</span>
            </div>
            <div class="item-score">
              <strong>65</strong> / 100
            </div>
          </li>

        </ul>

        <button class="card-btn">Continue</button>
      </div>

    </section>
  </main>
</body>
</html>
